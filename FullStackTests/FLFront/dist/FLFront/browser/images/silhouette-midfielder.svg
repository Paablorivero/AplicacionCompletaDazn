<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <g opacity="0.18">
    <!-- Centrocampista: corriendo con balón, postura dinámica -->
    <circle cx="105" cy="35" r="18" fill="#10b981"/>
    <path d="M105 53 L98 160" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <!-- Brazo delantero -->
    <path d="M102 78 L60 100" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <!-- Brazo trasero -->
    <path d="M102 78 L148 95" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <!-- Puños -->
    <circle cx="60" cy="100" r="4.5" fill="#10b981"/>
    <circle cx="148" cy="95" r="4.5" fill="#10b981"/>
    <!-- Pierna delantera extendida -->
    <path d="M98 160 L65 225 L55 280" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pierna trasera doblada -->
    <path d="M98 160 L130 210 L145 270" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pies -->
    <path d="M55 280 L40 282" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M145 270 L158 275" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <!-- Balón -->
    <circle cx="48" cy="260" r="10" stroke="#10b981" stroke-width="2.5" fill="none"/>
  </g>
</svg>
