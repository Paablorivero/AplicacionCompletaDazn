<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <g opacity="0.18">
    <!-- Delantero: chutando, pierna en alto -->
    <circle cx="95" cy="35" r="18" fill="#ef4444"/>
    <path d="M95 53 L90 155" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <!-- Brazo izquierdo levantado (celebración) -->
    <path d="M92 75 L55 50" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <!-- Brazo derecho atrás -->
    <path d="M92 75 L135 105" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <!-- Puños -->
    <circle cx="55" cy="50" r="4.5" fill="#ef4444"/>
    <circle cx="135" cy="105" r="4.5" fill="#ef4444"/>
    <!-- Pierna de apoyo -->
    <path d="M90 155 L75 225 L72 285" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pierna chutando hacia arriba -->
    <path d="M90 155 L130 185 L165 175" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pies -->
    <path d="M72 285 L57 287" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <path d="M165 175 L178 170" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <!-- Balón en vuelo -->
    <circle cx="175" cy="150" r="10" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  </g>
</svg>
